<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Student Registration</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background: #f4f6f8;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      flex-direction: column;
    }

    header, footer {
      background-color: #004080;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
      width: 100%;
    }

    nav {
      width: 100%;
      background-color: #004080;
      padding: 1rem 0;
    }

    nav ul {
      list-style: none;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }

    nav ul li {
      margin-right: 20px;
    }

    nav ul li a {
      text-decoration: none;
      color: white;
      font-weight: bold;
      font-size: 1.1rem;
      padding: 8px 15px;
      transition: background-color 0.3s ease;
    }

    nav ul li a:hover {
      background-color: #0066cc;
      border-radius: 4px;
    }

    .container {
      background: #ffffff;
      width: 90%;
      max-width: 800px;
      margin: 30px auto;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
      font-weight: 700;
    }

    label {
      font-weight: 600;
      margin-top: 15px;
      display: block;
      color: #555;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
      font-size: 1rem;
      background: #f9f9f9;
      transition: 0.2s ease-in-out;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #0066cc;
      background-color: #fff;
      outline: none;
    }

    textarea {
      resize: vertical;
    }

    .btn {
      background: #0066cc;
      color: white;
      padding: 12px 20px;
      margin-top: 20px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s ease;
      width: 100%;
    }

    .btn:hover {
      background: #004c99;
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .container {
        padding: 20px;
      }

      input, textarea, select {
        font-size: 0.9rem;
      }

      .btn {
        font-size: 0.9rem;
      }

      nav ul li {
        margin-right: 10px;
      }

      nav ul li a {
        font-size: 0.9rem;
        padding: 6px 12px;
      }
    }
</style>
<header>
    <h1>Placement Cell</h1>
</header>

<nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="about.html">About</a></li>
        <li><a href="student.html">Student Section</a></li>
        <li><a href="company.html">Company Section</a></li>
        <li><a href="admin.html">Admin Panel</a></li>
        <li><a href="contact.html">Contact Us</a></li>
    </ul>
</nav>


</head>
<body>

  <div class="container">
    <form id="registrationForm" enctype="multipart/form-data">
      <!-- Step 1 -->
      <div id="step1">
        <h2>Basic Registration</h2>
        <label for="fullName">Full Name</label>
        <input type="text" id="fullName" required />

        <label for="email">Email Address</label>
        <input type="email" id="email" required />

        <label for="password">Password</label>
        <input type="password" id="password" required />

        <label for="confirmPassword">Confirm Password</label>
        <input type="password" id="confirmPassword" required />

        <button type="button" class="btn" onclick="nextStep()">Next</button>
      </div>

      <!-- Step 2 -->
      <div id="step2" class="hidden">
        <h2>Academic & Personal Details</h2>

        <label for="mobile">Mobile Number</label>
        <input type="tel" id="mobile" required />

        <label for="address">Address</label>
        <textarea id="address" required></textarea>

        <label for="course">Course Name</label>
        <select id="course" required>
          <option value="">Select Course</option>
          <option value="BCA">BCA</option>
          <option value="BSc IT">BSc IT</option>
          <option value="BE">BE</option>
          <option value="BBA">BBA</option>
        </select>

        <label for="specialization">Subject / Specialization</label>
        <input type="text" id="specialization" required />

        <label for="yearSemester">Year / Semester</label>
        <input type="text" id="yearSemester" required />

        <label for="university">University / College Name</label>
        <input type="text" id="university" required />

        <label for="rollNumber">Roll Number / PRN Number</label>
        <input type="text" id="rollNumber" required />

        <label for="grade10">10th Grade % / Marks</label>
        <input type="text" id="grade10" required />

        <label for="grade12">12th Grade % / Diploma Marks</label>
        <input type="text" id="grade12" required />

        <label for="degreeMarks">Degree CGPA / Semester Marks</label>
        <input type="text" id="degreeMarks" required />

        <label for="backlogs">Backlogs (if any)</label>
        <input type="text" id="backlogs" required />

        <label for="resume">Resume Upload (PDF)</label>
        <input type="file" id="resume" accept=".pdf" required />

        <label for="skills">Skills (e.g., Python, Java)</label>
        <textarea id="skills" required></textarea>

        <label for="projects">Projects (Title, Description, GitHub)</label>
        <textarea id="projects" required></textarea>

        <label for="internships">Internships / Work Experience</label>
        <textarea id="internships"></textarea>

        <label for="preferredRoles">Preferred Job Roles</label>
        <input type="text" id="preferredRoles" required />

        <label for="expectedSalary">Expected Salary (Optional)</label>
        <input type="text" id="expectedSalary" />

        <button type="submit" class="btn">Submit</button>
      </div>
    </form>
  </div>

  <script>
    function nextStep() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirmPassword").value;
      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return;
      }

      document.getElementById("step1").classList.add("hidden");
      document.getElementById("step2").classList.remove("hidden");
    }

    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      alert("Form submitted successfully!");
      // You can add AJAX or backend submission here
    });
  </script>

</body>
</html>
